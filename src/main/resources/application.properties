spring.application.name=trip-split
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tripsplit}
spring.datasource.username=${DATABASE_USER:tripsplit}
spring.datasource.password=${DATABASE_PASSWORD:tripsplit}
spring.datasource.hikari.maximum-pool-size=10

# Module events: transactional outbox in Postgres, completed rows deleted, retried after a crash.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true

spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,modulith
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

tripsplit.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
tripsplit.demo-data=${TRIPSPLIT_DEMO_DATA:false}
